name: Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Test Battery (Mock Mode)
        env:
          MONGO_URI: mongodb://localhost:27017/sentinel_ci
          JWT_SECRET: ci_secret_key_minimum_32_characters_long_123
          NODE_ENV: test
          BENCHMARK_MODE: mock
          ALLOW_DEV_TOKENS: 'false'
        run: npm --prefix backend test
